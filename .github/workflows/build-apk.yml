name: Build Android APK (Manual)

on:
  # HANYA manual trigger (tidak berjalan otomatis saat commit/push)
  workflow_dispatch:

jobs:
  build:
    name: Build Split APK (ARM 64-bit & 32-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan signing keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/phantek.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=phantek.jks
          EOF
          elif [ -f "android/app/phantek.jks" ]; then
            echo "Menggunakan repository phantek.jks keystore..."
            cat <<EOF > android/key.properties
          storePassword=phantek123
          keyPassword=phantek123
          keyAlias=phantek
          storeFile=phantek.jks
          EOF
          else
            echo "Keystore tidak ditemukan!"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APK (ARM Only)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Organize APK Artifacts
        run: |
          cd build/app/outputs/flutter-apk/
          # Pindahkan dan beri nama jelas untuk kedua arsitektur ARM
          mv app-arm64-v8a-release.apk Phantek-Gallery-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk Phantek-Gallery-armeabi-v7a.apk
          # Hapus file .apk lain (termasuk universal APK jika ter-generate) agar tepat 2 file tersisa
          rm -f app-*.apk *x86*
          echo "Hasil build APK:"
          ls -la *.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantek-gallery-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
