name: Build Android APK (Manual)

on:
  # HANYA manual trigger (tidak berjalan otomatis saat commit/push)
  workflow_dispatch:

jobs:
  build:
    name: Build APK (ARM 64-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::GitHub Secrets untuk release signing belum lengkap! Pastikan KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, dan KEY_PASSWORD telah diatur di Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Mengonfigurasi release keystore dari GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/phantek.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=phantek.jks" >> android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (ARM 64-bit)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Organize APK Artifacts
        run: |
          cd build/app/outputs/flutter-apk/
          # Pindahkan dan beri nama jelas untuk arsitektur ARM 64-bit
          mv app-arm64-v8a-release.apk Phantek-Gallery-arm64-v8a.apk
          # Hapus file .apk sisa lainnya jika ada
          rm -f app-*.apk *x86*
          echo "Hasil build APK:"
          ls -la *.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantek-gallery-arm64-v8a
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
