name: phantek_gallery
description: "Phantek Gallery - offline-first photo & video gallery for Android."
publish_to: 'none'
version: 2.19.2+762487
homepage: https://github.com/zerabyte88/phantek-gallery
repository: https://github.com/zerabyte88/phantek-gallery
issue_tracker: https://github.com/zerabyte88/phantek-gallery/issues

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Local storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Media scanning & permissions ─────────────────────────────────────────
  photo_manager: ^3.4.4
  permission_handler: ^13.0.2

  # ── Video player (AndroidX Media3 ExoPlayer) ──────────────────────────────
  video_player: ^2.9.2

  package_info_plus: ^8.0.2
  path_provider: ^2.1.4

  # ── Utilities ────────────────────────────────────────────────────────────
  path: ^1.9.0
  intl: ^0.20.3
  equatable: ^2.0.5

  url_launcher: ^6.3.3
  image: ^4.12.0

  # ── On-device ML & Offline Translation (Permissive Licenses: Apache 2.0 / MIT) ──
  google_mlkit_text_recognition: ^1.0.1
  google_mlkit_translation: ^1.0.1
  flutter_llama: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
