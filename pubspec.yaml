name: phantek_gallery
description: "Phantek Gallery – offline-first photo & video gallery for Android."
publish_to: 'none'
version: 1.3.6+12

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Local storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Media scanning & permissions ─────────────────────────────────────────
  photo_manager: ^3.4.4
  permission_handler: ^13.0.2

  # ── Video player (MPV engine) ─────────────────────────────────────────────
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.0.0  # native libs for Android

  # ── Image viewer ─────────────────────────────────────────────────────────
  photo_view: ^0.15.0

  # ── OTA update (GitHub Releases) ─────────────────────────────────────────
  http: ^1.2.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4

  # ── Utilities ────────────────────────────────────────────────────────────
  path: ^1.9.0
  intl: ^0.19.0
  equatable: ^2.0.5

  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
